services:
  gateway:
    image: nginx:alpine
    container_name: smartcart_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api
      - payment-service
      - notification-service
    restart: always

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcart_core_api
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=smartcart_prod
      - POSTGRES_URL=postgresql+psycopg2://smartcart_user:secure_pg_pass@postgres:5432/smartcart_relational
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=prod_super_secure_jwt_secret_smartcart_32_chars
      - APP_ENV=dev
      - PAYMENT_WEBHOOK_SECRET=prod_webhook_secret_key_98765
      - ADMIN_PHONES=+919999900000
    depends_on:
      - mongodb
      - postgres
      - redis
    restart: always

  payment-service:
    build:
      context: ./backend
      dockerfile: services_standalone/payment_service/Dockerfile
    container_name: smartcart_payment_service
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_URL=postgresql+psycopg2://smartcart_user:secure_pg_pass@postgres:5432/smartcart_relational
      - JWT_SECRET=prod_super_secure_jwt_secret_smartcart_32_chars
      - RAZORPAY_ENVIRONMENT=${RAZORPAY_ENVIRONMENT:-test}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-d92a0cd52716c21ac2084a753610d323fca21c48}
      - PAYMENT_SERVICE_PORT=8002
    depends_on:
      - postgres
    restart: always

  notification-service:
    build:
      context: ./backend
      dockerfile: services_standalone/notification_service/Dockerfile
    container_name: smartcart_notification_service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=smartcart_prod
      - JWT_SECRET=prod_super_secure_jwt_secret_smartcart_32_chars
      - NOTIFICATION_SERVICE_PORT=8003
    depends_on:
      - mongodb
    restart: always

  worker-service:
    build:
      context: ./backend
      dockerfile: services_standalone/worker_service/Dockerfile
    container_name: smartcart_worker_service
    environment:
      - POSTGRES_URL=postgresql+psycopg2://smartcart_user:secure_pg_pass@postgres:5432/smartcart_relational
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=dev
    depends_on:
      - postgres
      - redis
    restart: always

  mongodb:
    image: mongo:7.0
    container_name: smartcart_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: smartcart_postgres
    environment:
      POSTGRES_USER: smartcart_user
      POSTGRES_PASSWORD: secure_pg_pass
      POSTGRES_DB: smartcart_relational
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: smartcart_redis
    ports:
      - "6380:6379"
    restart: always

volumes:
  mongo_data:
  postgres_data:
