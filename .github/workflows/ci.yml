name: SmartCart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Code Quality
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcart_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: smartcart_relational
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist httpx sqlalchemy psycopg2-binary alembic redis boto3

      - name: Run Backend Pytest Suite
        env:
          API: http://127.0.0.1:8001/api
          EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
          JWT_SECRET: ci_secret_jwt_key_smartcart_32_chars_1234
          PAYMENT_WEBHOOK_SECRET: ci_webhook_secret_key_1234
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: smartcart_test
          POSTGRES_URL: postgresql://smartcart_test:test_password@127.0.0.1:5432/smartcart_relational
          ADMIN_PHONES: "+919999900000"
          APP_ENV: dev
        run: |
          cd backend
          python -m uvicorn server:app --host 127.0.0.1 --port 8001 &
          sleep 3
          pytest tests/test_smoke.py tests/test_cod_tracking_runs.py

  frontend-check:
    name: Frontend Quality & Expo Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Verify Expo Project Config
        run: |
          cd frontend
          npx expo-doctor
