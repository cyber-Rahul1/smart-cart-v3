events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting: 10 requests/s with burst of 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Upstreams for core and extracted microservices
    upstream core_marketplace {
        server core-api:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream payment_microservice {
        server payment-service:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream notification_microservice {
        server notification-service:8003 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 15M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Health Checks
        location /health {
            proxy_pass http://core_marketplace/health;
            access_log off;
        }

        # Route 1: Payment Microservice
        location /api/payments/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr_limit 10;

            proxy_pass http://payment_microservice;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $request_id;
        }

        # Route 2: Notification Microservice
        location /api/notifications/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr_limit 10;

            proxy_pass http://notification_microservice;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $request_id;
        }

        # Route 3: Core Marketplace API (All other /api/ endpoints)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr_limit 10;

            proxy_pass http://core_marketplace;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $request_id;
        }
    }
}
